[panel_meta]
title = "ParamEq"
default_size = [512, 440]
min_size = [512, 440]
max_size = [512, 440]
bg_color = [0.1, 0.1, 0.2, 1.0]

# input
[elements.audio_in_pin]
type = "pin"
pin_type = "audio"
pin_direction = "input"
pin_name = "audio_in"
pin_position_y = 24.0

#output
[elements.audio_out_pin]
type = "pin"
pin_type = "audio"
pin_direction = "output"
pin_name = "audio_out"
pin_position_y = 24.0

[elements.slider_gain_low]
